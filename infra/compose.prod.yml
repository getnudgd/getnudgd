services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - web

  web:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    expose:
      - "3000"

  worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    command: ["npx", "tsx", "src/jobs/run-worker.ts"]
    env_file:
      - ../.env

  gotenberg:
    image: gotenberg/gotenberg:8
    expose:
      - "3000"

volumes:
  caddy-data:
